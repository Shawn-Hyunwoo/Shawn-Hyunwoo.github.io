  summary: >
    Research scientist on the Quantum AI Team at Norma, working on practical quantum algorithms for the NISQ era.
    Interested in classical simulation of quantum circuits and the quantum–classical boundary (Pauli propagation,
    classical surrogates), quantum machine learning and quantum generative models, HPC–QPU hybrid workflows, and
    hardware-aware NISQ algorithms and quantum error mitigation. B.S. in Physics & Artificial Intelligence from
    Sogang University.

