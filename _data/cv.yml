    Experience:
      - company: Norma, Inc.
        position: Researcher, Quantum AI Team
        location: Seoul, South Korea
        start_date: 2025-07
        end_date: present
        highlights:
          - "Co-developed Norma's in-house Pauli Propagation toolkit (\"Pado-Pauli\") for quantum algorithm simulation, a GPU-accelerated, differentiable surrogate publicly released on GitHub; the GPU path runs ~35-49x faster than the CPU path (coefficient-truncation error <1e-4), with native batched processing for quantum-native ML and head-to-head benchmarks against existing Pauli-propagation implementations reported in a paper in preparation."
          - "Built quantum generative models (Quantum GAN, IQP-QCBM) in PyTorch and NVIDIA CUDA-Q for drug discovery; studied the expressivity and trainability of variational quantum circuits."
          - "Designed a neural-network-based quantum error mitigation (QEM) model that predicts and counteracts real-hardware error characteristics, substantially reducing the total variation distance (TVD) between noisy and ideal output distributions."
          - "Analyzed the noise resilience of VQCs (VQE, QAOA) under both simulation and real-hardware environments."

      - company: National Information Society Agency (NIA) — KQIC Quantum Internship (4th Cohort)
        position: Quantum Computing & AI Research Intern (placed at Norma, Inc.)
        location: Seoul, South Korea
        start_date: 2025-07
        end_date: 2025-10
        highlights:
          - "Selected for a competitive, nationally administered quantum computing & AI internship; completed a 4-month research project at Norma evaluated by an industry and government panel."
          - "Initiated the drug-discovery project: processed 1.4M augmented SMILES representations of KRAS G12D inhibitor candidates and built data pipelines feeding downstream quantum generative model training."
          - "Performance led directly to conversion to a full-time research position at Norma."

      - company: Sogang University, Department of Physics
        position: Research Assistant (Supervisor — Prof. Minsoo Kim)
        location: Seoul, South Korea
        start_date: 2024-09
        end_date: 2024-12
        highlights:
          - "Analyzed quantum Hall transport data in mesoscopic 2D systems."
          - "Studied valley-dependent transport and Dirac-cone related phenomena, and supported theoretical modeling linking experimental observables to band structure."

      - company: Pohang University of Science and Technology (POSTECH), Department of Physics
        position: Research Assistant (Supervisor — Prof. Yoonho Kim)
        location: Pohang, South Korea
        start_date: 2024-07
        end_date: 2024-07
        highlights:
          - "Research intern at the Quantum Optics and Quantum Information Group."
          - "Designed and aligned a high-precision interferometer and conducted Bell-test measurements using a 1550 nm Kalmar laser."
          - "Performed SPDC (Spontaneous Parametric Down-Conversion) experiments for photon-pair generation, and supported time-energy entanglement experiments."

