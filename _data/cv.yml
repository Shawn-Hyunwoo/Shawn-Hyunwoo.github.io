    Selected Projects:
      - bullet: |-
          **Quantum Reframing Challenge 2026 — Finalist** (2026). Team of three, chemistry and materials track.

          - Built a pipeline of Pauli-propagation surrogate pre-training, QPU sampling, and sample-based quantum diagonalization (SQD) for Fe–N₂ catalysis (Haber–Bosch N₂ activation) models at 12-20 qubits, including a run on IonQ Forte-1 hardware.

      - bullet: |-
          **Quantum Generative Models for Drug Discovery** (Jul 2025 – present). Norma, Inc. — part of the NRF Korea Quantum Computing Challenge (2024-2026).

          - Leading quantum generative model development for KRAS G12D inhibitor discovery.
          - Curated 1.4M augmented SMILES; built pipelines encoding SMILES into (4, 16)-dimensional latent vectors via a Transformer.
          - Developed a Quantum GAN that generates latent vectors mimicking the encoder distribution to propose novel molecular candidates.

      - bullet: |-
          **Neural-Network Quantum State Tomography (NN-QST) via RBM** (Mar 2025 – Jun 2025). Sogang University.

          - Built a Restricted Boltzmann Machine (RBM) generative model to reconstruct quantum states from measurement bitstrings.
          - Managed the full ML pipeline from preprocessing through training to fidelity evaluation, recovering states from measurement statistics alone.

      - bullet: |-
          **Solving Combinatorial Optimization with Quantum Algorithms**

          - Implemented QAOA-based solutions for the NP-hard fractional Knapsack Problem on quantum computers.
          - Formulated optimization problems as Ising Hamiltonians and applied heuristic optimization strategies.

      - bullet: |-
          **Full-stack Remote Control System for Laboratory Instrumentation**

          - Developed a Python-based remote-control system for digital oscilloscopes to automate experimental data acquisition.
          - Implemented end-to-end device control, data extraction, real-time visualization and analysis.

